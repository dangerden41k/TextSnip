name: Release

# Push a tag like v1.4.1 -> builds the portable TextSnip.exe and publishes a GitHub Release.
# The app's built-in updater reads the latest Release, downloads the asset named TextSnip.exe and
# refuses to install it unless its SHA-256 matches (GitHub's asset digest or TextSnip.exe.sha256).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false # build scripts (npm ci, tests) must not find the repo token in git config

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"; exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run dist

      - name: Sanity check the exe
        shell: bash
        run: |
          test -f dist/TextSnip.exe
          size=$(stat -c %s dist/TextSnip.exe)
          echo "TextSnip.exe = $size bytes"
          test "$size" -gt 50000000
          head -c 2 dist/TextSnip.exe | grep -q MZ

      - name: Checksum
        shell: bash
        run: sha256sum dist/TextSnip.exe | cut -d' ' -f1 > dist/TextSnip.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TextSnip.exe dist/TextSnip.exe.sha256 \
            --title "TextSnip ${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Keep the exe as a build artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TextSnip-exe
          path: |
            dist/TextSnip.exe
            dist/TextSnip.exe.sha256
